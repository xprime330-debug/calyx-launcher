name: Signed Calyx release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore release keystore
        env:
          CALYX_KEYSTORE_BASE64: ${{ secrets.CALYX_KEYSTORE_BASE64 }}
        run: |
          test -n "$CALYX_KEYSTORE_BASE64" || { echo "Missing CALYX_KEYSTORE_BASE64 repository secret"; exit 1; }
          echo "$CALYX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/calyx-release.jks"
          echo "CALYX_KEYSTORE_PATH=$RUNNER_TEMP/calyx-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          CALYX_KEYSTORE_PASSWORD: ${{ secrets.CALYX_KEYSTORE_PASSWORD }}
          CALYX_KEY_ALIAS: ${{ secrets.CALYX_KEY_ALIAS }}
          CALYX_KEY_PASSWORD: ${{ secrets.CALYX_KEY_PASSWORD }}
        run: |
          test -n "$CALYX_KEYSTORE_PASSWORD" -a -n "$CALYX_KEY_ALIAS" -a -n "$CALYX_KEY_PASSWORD"
          gradle assembleRelease --no-daemon
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" app/build/outputs/apk/release/app-release.apk --generate-notes --repo "$GITHUB_REPOSITORY"
